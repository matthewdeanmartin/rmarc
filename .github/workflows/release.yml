---
name: Release
concurrency: changelog
on:
  release:
    types: [released]
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.release.outputs.branch }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with: {python-version: '3.14'}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, push branch and open PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          # One command does everything the bump job used to do in shell:
          # bump changelog + version files, branch, [skip ci] commit,
          # --force-with-lease push, and open the release PR. The [skip ci]
          # decision follows [defaults].skip_ci (default true).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          VERSION="${RELEASE_VERSION#v}"
          # --json is a global flag, so it must precede the `release-bump`
          # subcommand (argparse rejects it if placed after).
          uv run kaclm --json release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merge once the PyPI publish succeeds." \
            --yes > release-bump.json
          echo "version=$(python -c "import json;print(json.load(open('release-bump.json'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "branch=$(python -c "import json;print(json.load(open('release-bump.json'))['branch'])")" >> "$GITHUB_OUTPUT"
  build-wheels:
    name: Wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-amd64
            os: windows-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55  # v4.1.0

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs: bump
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Verify sdist version matches release
        env:
          EXPECTED: ${{ needs.bump.outputs.version }}
        run: |
          SDIST=$(ls dist/*.tar.gz 2>/dev/null | head -1)
          if [ -z "$SDIST" ]; then
            echo "::error::No sdist found in dist/"
            exit 1
          fi
          # The release tag may be SemVer (5.4.0-rc.1) while the sdist filename
          # is PEP 440 normalized (5.4.0rc1), so compare normalized forms.
          python -m pip install --quiet packaging
          cat > /tmp/verify_sdist.py <<'EOF'
          import sys
          from packaging.utils import parse_sdist_filename
          from packaging.version import Version

          sdist, expected = sys.argv[1], sys.argv[2]
          _, found = parse_sdist_filename(sdist.rsplit("/", 1)[-1])
          if found != Version(expected):
              print(f"::error::sdist {sdist} is version {found}, expected {Version(expected)}")
              sys.exit(1)
          print(f"Verified: {sdist} matches version {expected} (normalized {found})")
          EOF
          python /tmp/verify_sdist.py "$SDIST" "$EXPECTED"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-wheels
      - build-sdist
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/rmarc
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          verbose: 'true'
