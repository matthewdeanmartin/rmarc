name: Python Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: "Test Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      # Only maturin + pytest, not the full dev group: some dev-only tools
      # (e.g. google-re2) have no wheels for prerelease Pythons and would
      # fail to build from source on 3.15.
      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --only-binary :all: maturin pytest pymarc==5.4.0

      - name: Build Rust extension
        run: uv run --no-project maturin develop

      - name: Run full test suite
        run: |
          uv run --no-project pytest test_pymarc/ -v

      - name: Verify MARC binary roundtrip
        run: |
          uv run --no-project python -c "
          from rmarc import MARCReader, Record
          with open('test_pymarc/one.dat', 'rb') as fh:
              original = fh.read()
          with open('test_pymarc/one.dat', 'rb') as fh:
              record = next(MARCReader(fh))
              assert record is not None
              assert original == record.as_marc(), 'MARC binary roundtrip failed'
          print('MARC binary roundtrip: OK')
          "

      - name: Verify cross-format consistency
        run: |
          uv run --no-project python -c "
          from rmarc import MARCReader, JSONReader, Record
          from rmarc.marcxml import parse_xml_to_array
          from rmarc.marcjson import parse_json_to_array
          import json

          # dat vs json
          with open('test_pymarc/one.json') as fh:
              json_records = parse_json_to_array(fh)
          with open('test_pymarc/one.dat', 'rb') as fh:
              dat_records = list(MARCReader(fh))
          assert len(json_records) == len(dat_records)
          for jr, dr in zip(json_records, dat_records):
              assert jr.as_marc() == dr.as_marc(), 'JSON/DAT mismatch'
          print('JSON <-> DAT consistency: OK')

          # json vs xml
          with open('test_pymarc/batch.json') as fh:
              json_records = parse_json_to_array(fh)
          xml_records = parse_xml_to_array('test_pymarc/batch.xml')
          assert len(json_records) == len(xml_records)
          for jr, xr in zip(json_records, xml_records):
              assert jr.as_marc() == xr.as_marc(), 'JSON/XML mismatch'
          print('JSON <-> XML consistency: OK')
          "
