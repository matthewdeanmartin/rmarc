[project]
name = "rmarc"
version = "5.4.0"
description = "Pymarc compaitible reimplementation in Rust."
readme = "README.md"
authors = [{ name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
keywords = ["bash", "gitlab", "github"]
license = "MIT"
requires-python = ">=3.11"
dependencies = [

]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
fast = ["orjson>=3.9", "lxml>=5.0"]
fast-json = ["orjson>=3.9"]
fast-xml = ["lxml>=5.0"]

[project.urls]
Repository = "https://github.com/matthewdeanmartin/rmarc"
Documentation = "https://rmarc.readthedocs.io/en/latest/"
Changelog = "https://github.com/matthewdeanmartin/rmarc/blob/main/CHANGELOG.md"

homepage = "https://github.com/matthewdeanmartin/rmarc"
issues = "https://github.com/matthewdeanmartin/rmarc/issues/"




[dependency-groups]
dev = [
    # Existing developer tools require the HTTPX 0.x API.
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",

    "pymarc",
    "jiggle-version>=2.0.1",
    "maturin>=1.9.6; python_version >= '3.14'",
    "pydantic>=2.12.0; python_version >= '3.14'",
    "troml-dev-status>=0.4.1",
    "git2md",
    "pyclean; python_version >= '3.12'",
    "strip-docs>=1.0; python_version >= '3.12'",
    "gha-update; python_version >= '3.12'",
    "mkdocstrings[python]",
    "mkdocs<2; python_version >= '3.12'",
    "mdformat",
    # plugin finder
    "packaging",
    # mpy
    "mypy",
    "types-lxml>=2026.2.16",
    "pyrefly>=1.3.2",
    "types-toml",
    "types-jsonschema",
    # reports
    # build
    "vermin",
    "metametameta>=0.1.14",
    "hatchling",
    "ruff>=0.12.0",
    "pylint",
    "bandit",
    "pre-commit",
    # testing tools
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    "pytest-sugar>=0.9.7",
    "pytest-mock",
    "pytest-unused-fixtures",
    "hypothesis[cli]",
    "detect-test-pollution",
    "pytest-timeout>=2.4.0",
    # docs
    "interrogate>=1.5.0",
    "pydoctest==0.2.1",
    "pdoc3>=0.5.0",
    "mdformat>=0.5.0",
    "linkcheckmd>=1.4.0",
    "codespell>=2.2.6",
    "pyenchant>=3.2.2",
    "maturin>=1.12.6",
    "cibuildwheel>=3.4.0",
    "pyright>=1.1.408",
    "mypy>=1.19.1",
    "pytest-benchmark>=5.2.3",
    # pytest-benchmark 5.3 imports cpuinfo, while its dependency supplies cpuinfo2.
    "py-cpuinfo>=9",
    "keepachangelog-manager-fork[fast]>=6.10.1; python_version < '3.15'",
    "keepachangelog-manager-fork[stdlib]>=6.10.1; python_version >= '3.15'",
]

# Optional competitor backend for three-way benchmarks. It has no Windows
# cp315 wheel and its source build needs dlltool; core tests do not use it.
benchmark = ["mrrc>=0.7.4"]

[tool.uv]
# Compatibility constraint for third-party tools; this project does not use HTTPX directly.
constraint-dependencies = ["httpx<1"]
default-groups = ["dev"]

[tool.uv.sources]
rmarc = { workspace = true }

[tool.uv.workspace]
members = [
    "./",
    "sample_src/sample_app",
]

[tool.uv.pip]
universal = true
[project.scripts]
rmarc = "rmarc.__main__:main"


[build-system]
requires = ["maturin>=1.12,<3.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "rmarc._rmarc"
features = ["pyo3/extension-module"]

[tool.cibuildwheel]
# 3.15 is still a prerelease; cibuildwheel silently drops cp315-* without this.
enable = ["cpython-prerelease"]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = ["*-musllinux_*", "*-win32"]
test-requires = ["pytest", "hypothesis", "pymarc==5.4.0"]
test-command = "pytest {project}/test_pymarc -v"

[tool.cibuildwheel.linux]
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
before-all = "dnf install -y curl && curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" }


[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
    "test_pymarc",
    "sample_src/sample_app/tests",
]
junit_family = "xunit1"
norecursedirs = ["vendor", "scripts", ".hypothesis"]
# don't know how to do this in toml
#addopts = "--strict-markers"
#markers =
#	slow: marks tests as slow (deselect with '-m "not slow"')
#	fast: marks tests as fast (deselect with '-m "not fast"')

[tool.isort]
default_section = "THIRDPARTY"
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["dedlin"]
line_length = 120
multi_line_output = 3
use_parentheses = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "C", "S", "SIM", "I"]
ignore = ["RUF100", 
    "F403", "F401",   # star imports / unused imports (re-exports)
    "E501",           # line length — enforced by formatter not linter
    "C901",           # McCabe complexity
    "S317",           # defusedxml
    "S101",           # assert is fine in tests
    "SIM110",
    "SIM115",
    "SIM110",
    "SIM108"
]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.coverage.run]
branch = true
source = ["python/rmarc"]

[tool.coverage.report]
skip_covered = true
skip_empty = true
show_missing = true
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError",
    "except ModuleNotFoundError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
check_untyped_defs = true
exclude = ["^dist", "^target", "^pymarc_src"]
python_version = "3.11"

[tool.pyrefly]
project-includes = ["python/rmarc"]
search-path = ["python"]
python-version = "3.11"

[tool.pyright]
pythonVersion = "3.11"
include = ["python/rmarc"]
exclude = ["dist", "target", "pymarc_src"]
typeCheckingMode = "basic"

[tool.bug_trail]
app_name = "rmarc"
app_author = "matth"
source_folder = "rmarc"

# changelogmanager (keepachangelog-manager-fork) drives the release workflows.
# See .github/workflows/create_draft_release.yml and release.yml.
[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
enforce_preamble = true
format = "auto"

[tool.changelogmanager.defaults]
skip_ci = true
error_format = "github"
commit_schema = "keepachangelog"
schema_version = "current"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
